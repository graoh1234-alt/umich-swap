<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>UMichSwap — Chat</title>
  <meta name="description" content="Chat about a listing on UMichSwap."/>
  <style>
    :root{--max:1100px;--r:18px;--sh:0 12px 34px rgba(0,0,0,.08);--b:1px solid rgba(0,0,0,.08);--p:#1f4fff;--mut:rgba(16,17,20,.75);--bg:linear-gradient(180deg,#f5f8ff 0%,#fff 60%)}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:#101114}
    a{color:inherit}
    .wrap{max-width:var(--max);margin:0 auto;padding:26px 18px 64px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:var(--b);border-radius:var(--r);box-shadow:var(--sh);position:sticky;top:12px;z-index:10}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900}
    .nav{display:flex;gap:14px;font-size:14px}
    .nav a{text-decoration:none;opacity:.85}
    .nav a:hover{opacity:1;text-decoration:underline}
    .card{border:var(--b);border-radius:var(--r);background:#fff;box-shadow:var(--sh);padding:18px;margin-top:14px}
    .topbar{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
    h1{margin:0;font-size:22px;letter-spacing:-.02em}
    .sub{margin:4px 0 0;color:var(--mut);font-size:13px}
    .pill{font-size:12px;padding:6px 10px;border-radius:999px;border:var(--b);background:#fff;color:rgba(16,17,20,.75)}
    .chatBox{height:420px;overflow:auto;border:var(--b);border-radius:var(--r);padding:14px;background:linear-gradient(180deg,#fff 0%,#fbfcff 100%)}
    .msg{display:flex;margin:10px 0}
    .bubble{max-width:70%;padding:10px 12px;border-radius:16px;border:var(--b);box-shadow:0 10px 20px rgba(0,0,0,.04);font-size:14px;line-height:1.35}
    .meta{font-size:11px;color:rgba(16,17,20,.65);margin-top:6px}
    .me{justify-content:flex-end}
    .me .bubble{background:#eef3ff;border-color:rgba(31,79,255,.22)}
    .them .bubble{background:#fff}
    .composer{display:flex;gap:10px;margin-top:12px}
    textarea{flex:1;min-height:46px;max-height:110px;resize:vertical;padding:12px;border-radius:14px;border:1px solid rgba(0,0,0,.16);font-size:14px}
    button{cursor:pointer;border:0;border-radius:14px;padding:12px 14px;font-weight:900;font-size:14px;background:var(--p);color:#fff}
    .danger{background:#fff;border:var(--b);color:#101114}
    footer{margin-top:22px;text-align:center;font-size:12px;color:rgba(16,17,20,.7)}
    @media(max-width:720px){header{position:static}.chatBox{height:360px}.bubble{max-width:85%}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span aria-hidden="true">🟦</span><span>UMichSwap</span></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="listings.html">Listings</a>
        <a href="list-item.html">List an item</a>
        <a href="inbox.html">Inbox</a>
        <a href="safety.html">Safety</a>
      </nav>
    </header>

    <section class="card">
      <div class="topbar">
        <div>
          <h1 id="title">Chat</h1>
          <div class="sub" id="subtitle">Loading…</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <span class="pill" id="whoami">You: —</span>
          <a class="pill" href="inbox.html">Back to Inbox</a>
          <a class="pill" id="view_listing" href="listings.html">View listing</a>
        </div>
      </div>

      <div class="chatBox" id="chat"></div>

      <div class="composer">
        <textarea id="text" placeholder="Type a message…"></textarea>
        <button id="send">Send</button>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <button class="danger" id="btn_delete_thread">Delete conversation (demo)</button>
      </div>
    </section>

    <footer>© <span id="year"></span> UMichSwap</footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const STORAGE_PROFILE  = "umichswap_profile";
    const STORAGE_THREADS  = "umichswap_threads";
    const STORAGE_MESSAGES = "umichswap_messages";

    function loadJSON(key, fallback){
      try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
      catch { return fallback; }
    }
    function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

    const params = new URLSearchParams(location.search);
    const threadId = params.get("thread") || "";

    const prof = loadJSON(STORAGE_PROFILE, { role:"buyer", name:"" });
    document.getElementById("whoami").textContent = `You: ${prof.name || "Anonymous"} (${prof.role})`;

    const threads = loadJSON(STORAGE_THREADS, []);
    const t = threads.find(x => x.threadId === threadId);

    const chatEl = document.getElementById("chat");
    const titleEl = document.getElementById("title");
    const subEl = document.getElementById("subtitle");
    const viewListing = document.getElementById("view_listing");

    if(!t){
      titleEl.textContent = "This conversation can’t be found";
      subEl.textContent = "It may have been deleted or the link is incorrect.";
      chatEl.innerHTML = `<div style="padding:12px;border-radius:14px;border:1px solid rgba(0,0,0,.12);background:#fff8e6;color:rgba(16,17,20,.8)">
        Go back to <a href="inbox.html"><b>Inbox</b></a>.
      </div>`;
      document.getElementById("send").disabled = true;
      document.getElementById("text").disabled = true;
    } else {
      titleEl.textContent = t.listingTitle || "Chat";
      subEl.textContent = `Buyer: ${t.buyerName || "Buyer"} • Seller: ${t.sellerName || "Seller"}`;
      // If you have item.html, link to it:
      if(t.listingId){
        viewListing.href = `item.html?id=${encodeURIComponent(t.listingId)}`;
      }
      render();
    }

    function render(){
      const messagesMap = loadJSON(STORAGE_MESSAGES, {});
      const msgs = messagesMap[threadId] || [];
      chatEl.innerHTML = "";
      msgs.forEach(m => {
        const isMe = (m.senderRole === prof.role && m.senderName === prof.name);
        const row = document.createElement("div");
        row.className = "msg " + (isMe ? "me" : "them");
        row.innerHTML = `
          <div class="bubble">
            ${escapeHTML(m.text)}
            <div class="meta">${escapeHTML(m.senderName || "Someone")} • ${new Date(m.ts).toLocaleString()}</div>
          </div>
        `;
        chatEl.appendChild(row);
      });
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // Send message
    document.getElementById("send").addEventListener("click", sendMessage);
    document.getElementById("text").addEventListener("keydown", (e) => {
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });

    function sendMessage(){
      const txt = document.getElementById("text").value.trim();
      if(!txt || !t) return;

      const senderName = prof.name || "Anonymous";
      const senderRole = prof.role || "buyer";

      const messagesMap = loadJSON(STORAGE_MESSAGES, {});
      const msgs = messagesMap[threadId] || [];

      msgs.push({ text: txt, senderName, senderRole, ts: Date.now() });
      messagesMap[threadId] = msgs;
      saveJSON(STORAGE_MESSAGES, messagesMap);

      // Update thread lastActivity
      const threads = loadJSON(STORAGE_THREADS, []);
      const idx = threads.findIndex(x => x.threadId === threadId);
      if(idx >= 0){
        threads[idx].lastActivity = Date.now();
        saveJSON(STORAGE_THREADS, threads);
      }

      document.getElementById("text").value = "";
      render();
    }

    // Delete conversation
    document.getElementById("btn_delete_thread").addEventListener("click", () => {
      if(!t) return;

      const threads = loadJSON(STORAGE_THREADS, []).filter(x => x.threadId !== threadId);
      saveJSON(STORAGE_THREADS, threads);

      const messagesMap = loadJSON(STORAGE_MESSAGES, {});
      delete messagesMap[threadId];
      saveJSON(STORAGE_MESSAGES, messagesMap);

      location.href = "inbox.html";
    });

    function escapeHTML(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;")
        .replaceAll("\n","<br/>");
    }
  </script>
</body>
</html>
