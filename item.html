<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>UMichSwap — Item Details</title>
  <meta name="description" content="View listing details on UMichSwap.">
  <style>
    :root { --max:1100px; --r:18px; --sh:0 12px 34px rgba(0,0,0,.08); --b:1px solid rgba(0,0,0,.08); --p:#1f4fff; --mut:rgba(16,17,20,.75);}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:linear-gradient(180deg,#f5f8ff 0%,#fff 60%);color:#101114;line-height:1.5}
    a{color:inherit}
    .wrap{max-width:var(--max);margin:0 auto;padding:26px 18px 64px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:var(--b);border-radius:var(--r);box-shadow:var(--sh);position:sticky;top:12px;z-index:10}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900}
    .nav{display:flex;gap:14px;font-size:14px}
    .nav a{text-decoration:none;opacity:.85}
    .nav a:hover{opacity:1;text-decoration:underline}

    .card{border:var(--b);border-radius:var(--r);background:#fff;box-shadow:var(--sh);padding:18px}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
    .thumb{height:320px;border-radius:14px;border:var(--b);background:linear-gradient(135deg,#f2f5ff,#fff);display:flex;align-items:center;justify-content:center;font-weight:900;color:rgba(16,17,20,.45)}
    h1{margin:0 0 8px;font-size:30px;letter-spacing:-.02em}
    .sub{margin:0 0 12px;color:var(--mut)}
    .row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
    .chip{font-size:13px;padding:8px 10px;border-radius:999px;border:var(--b);background:#eef3ff}
    .price{font-size:24px;font-weight:1000}
    .meta{font-size:13px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px;border-radius:14px;font-weight:900;font-size:14px;text-decoration:none;cursor:pointer;border:0}
    .primary{background:var(--p);color:#fff}
    .ghost{border:var(--b);background:#fff}
    .divider{border:0;border-top:1px solid rgba(0,0,0,.08);margin:14px 0}
    .kpi{font-size:12px;color:rgba(16,17,20,.7)}
    .error{padding:14px;border:var(--b);border-radius:14px;background:#fff8e6}
    footer{margin-top:22px;text-align:center;font-size:12px;color:rgba(16,17,20,.7)}
    @media(max-width:920px){header{position:static}.grid{grid-template-columns:1fr}.thumb{height:240px}}
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand"><span aria-hidden="true">🟦</span><span>UMichSwap</span></div>
      <nav class="nav" aria-label="Primary">
        <a href="index.html" id="nav_home">Home</a>
        <a href="listings.html" id="nav_listings">Listings</a>
        <a href="list-item.html" id="nav_list_item">List an item</a>
        <a href="safety.html" id="nav_safety">Safety</a>
      </nav>
    </header>

    <div class="row" style="margin-top:16px">
      <a class="btn ghost" href="listings.html" id="btn_back_listings">← Back to listings</a>
      <a class="btn ghost" href="index.html#waitlist" id="btn_join_waitlist_top">Join waitlist</a>
    </div>

    <div id="content"></div>

    <footer>© <span id="year"></span> UMichSwap</footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // --- Mock product database (edit these anytime) ---
    const ITEMS = {
      1: {
        title: "Mini fridge (good condition)",
        price: 45,
        campus: "North Campus",
        category: "Electronics",
        condition: "Used - Good",
        seller: "Verified UMich student",
        description:
          "Compact mini fridge with working cooling. Minor scratches on the side. Perfect for dorm rooms. Pickup near North Campus.",
        pickup: "Meet at Pierpont Commons (safe pickup spot).",
        tags: ["Dorm essentials", "Pickup only", "No delivery"]
      },
      2: {
        title: "Desk lamp + organizer",
        price: 12,
        campus: "Central Campus",
        category: "Furniture",
        condition: "Used - Like New",
        seller: "Verified UMich student",
        description:
          "LED desk lamp with organizer tray. Bright settings + USB power. Great for study desks.",
        pickup: "Meet at Shapiro Library entrance.",
        tags: ["Study setup", "Great condition", "Quick pickup"]
      },
      3: {
        title: "ECON / Marketing textbooks bundle",
        price: 30,
        campus: "Diag pickup",
        category: "Textbooks",
        condition: "Used - Fair",
        seller: "Verified UMich student",
        description:
          "Bundle of textbooks/notes for intro ECON + marketing courses. Some highlighting and notes included.",
        pickup: "Meet at the Diag (daytime).",
        tags: ["Bundle deal", "Student-friendly", "Limited time"]
      }
    };

    // Read item id from URL like item.html?id=2
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const item = ITEMS[id];

    const content = document.getElementById("content");

    if (!item) {
      content.innerHTML = `
        <div class="card error" id="item_not_found">
          <strong>Listing not found.</strong>
          <p style="margin:8px 0 0;color:rgba(16,17,20,.75)">
            This listing may have been removed or the link is incorrect.
          </p>
          <div class="row" style="margin-top:12px">
            <a class="btn primary" href="listings.html" id="cta_go_listings">Go to listings</a>
            <a class="btn ghost" href="index.html#waitlist" id="cta_join_waitlist_error">Join waitlist</a>
          </div>
        </div>
      `;
    } else {
      document.title = `UMichSwap — ${item.title}`;

      content.innerHTML = `
        <div class="grid">
          <section class="card">
            <div class="thumb" id="product_image">Photo</div>
            <p class="kpi">Tip for analytics: track <code>view_item</code> when this page loads.</p>
          </section>

          <aside class="card">
            <h1 id="product_title">${item.title}</h1>
            <p class="sub" id="product_desc_short">${item.category} • ${item.condition}</p>

            <div class="price" id="product_price">$${item.price}</div>
            <div class="meta" style="margin-top:8px">
              <span id="product_campus">📍 ${item.campus}</span>
              <span id="product_seller">✅ ${item.seller}</span>
            </div>

            <div class="row" style="margin-top:12px">
              ${item.tags.map(t => `<span class="chip">${t}</span>`).join("")}
            </div>

            <hr class="divider"/>

            <h3 style="margin:0 0 6px;font-size:16px">Description</h3>
            <p style="margin:0 0 12px;color:rgba(16,17,20,.78)" id="product_description">${item.description}</p>

            <h3 style="margin:0 0 6px;font-size:16px">Pickup</h3>
            <p style="margin:0;color:rgba(16,17,20,.78)" id="product_pickup">${item.pickup}</p>

            <hr class="divider"/>

            <div class="row">
              <!-- These IDs are great for GTM click tracking -->
              <a class="btn primary" href="index.html#waitlist" id="cta_contact_seller">Contact seller (demo)</a>
              <button class="btn ghost" id="btn_save_item" type="button">Save</button>
              <a class="btn ghost" href="safety.html" id="cta_view_safety">Safety tips</a>
            </div>

            <p class="kpi">
              Demo buttons (no backend). Perfect for GA4 events: <code>select_item</code>, <code>contact_seller</code>, <code>save_item</code>.
            </p>
          </aside>
        </div>
      `;

      // Small UX-only interaction (also trackable)
      const saveBtn = document.getElementById("btn_save_item");
      saveBtn.addEventListener("click", () => {
        saveBtn.textContent = "Saved ✓";
        saveBtn.disabled = true;
      });
    }
  </script>
</body>
</html>
